name = "infinity-card-github-bridge"
main = "index.js"
compatibility_date = "2026-09-14"

[vars]
GITHUB_OWNER = "infinity-card"
GITHUB_REPO = "infinity-card"
GITHUB_BRANCH = "main"
GITHUB_ALLOWED_USER = "infinity-card"
# The Pages origin only; do not add a path here.
PUBLIC_APP_ORIGIN = "https://infinity-card.github.io"
BRIDGE_PUBLIC_URL = "https://infinity-card-github-bridge.abdoukassou1200.workers.dev"
# Backups must go to a separate private repository. Set these in the deployed
# Worker variables; leaving them empty disables remote backups safely.
GITHUB_BACKUP_OWNER = ""
GITHUB_BACKUP_REPO = ""
GITHUB_BACKUP_BRANCH = "main"
