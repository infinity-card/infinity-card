<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Infinity Card — carte de visite NFC personnalisable." />
    <meta name="theme-color" content="#f8f2e9" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/webp" href="assets/infinity-card/women-logo.webp" />
    <title>Infinity Card</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages has no custom cache headers. Network-first navigation and
      // the client-data fetch keep a stable NFC/QR URL current on every device.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js?v=2", { scope: "./" }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
